<header
  class="nav"
  [class.is-solid]="scroll.isSolid()"
  [class.is-hidden]="scroll.isHidden() && !menu.isOpen()"
>
  <div class="wrap nav__in">
    <a class="nav__logo" routerLink="/" aria-label="Team Baraia Promotion, accueil">
      <tbp-logo />
    </a>
    <nav class="nav__links" aria-label="Navigation principale">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{
          link.label
        }}</a>
      }
    </nav>
    <div class="nav__right">
      <a class="btn btn--primary btn--sm" routerLink="/evenements">
        Billetterie
        <span class="btn__ico" aria-hidden="true"><tbp-icon name="arrow" [size]="16" /></span>
      </a>
      <button
        class="menu-btn"
        type="button"
        [attr.aria-expanded]="menu.isOpen()"
        aria-controls="tbp-menu"
        (click)="toggleMenu()"
      >
        Menu
        <i></i>
      </button>
    </div>
  </div>
</header>
